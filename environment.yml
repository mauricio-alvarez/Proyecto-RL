name: mae-legacy
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.6
  - pip<21
  - setuptools<60
  - wheel
  - numpy=1.16
  - scipy=1.3.1
  - cffi
  - cython<3
  - pip:
      - click==7.0
      - xmltodict==0.12.0
      - gym==0.10.8
      - jsonnet==0.17.0
      - numpy-stl==2.10.1
      - mujoco-py>=1.50.1,<1.50.2
      - -e ./mujoco-worldgen
      - -e ./multi-agent-emergence-environments
